name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build test container
        run: docker build -f Dockerfile.ci -t plus-one-ci .
      - name: Tests, package build and lintian
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/src/dist" plus-one-ci
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
