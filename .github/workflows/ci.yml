name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Build test container
        run: docker build -f Dockerfile.ci -t plus-one-ci .
      - name: Tests, package build and lintian
        run: |
          mkdir -p dist
          docker run --rm -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -v "$PWD/dist:/src/dist" plus-one-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3  # v6.8
        with:
          bundle: plus-one.flatpak
          manifest-path: packaging/flatpak/io.github.gabrielesantangelo.PlusOne.yml
          # libnm only rebuilds when the manifest changes.
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Companion app, in the same container as locally (lint errors fail it)
        run: tools/android-docker.sh lint assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
