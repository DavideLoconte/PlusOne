name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build test container
        run: docker build -f Dockerfile.ci -t plus-one-ci .
      - name: Tests, package build and lintian
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/src/dist" plus-one-ci
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: plus-one.flatpak
          manifest-path: packaging/flatpak/io.github.santal.PlusOne.yml
          # libnm only rebuilds when the manifest changes.
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
