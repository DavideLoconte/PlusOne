name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' plusone/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
      - name: Build test container
        run: docker build -f Dockerfile.ci -t plus-one-ci .
      - name: Tests and package (the release is only made if they pass)
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/src/dist" plus-one-ci
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: plus-one_${{ github.ref_name }}_x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.santal.PlusOne.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: plus-one_*.flatpak

  publish:
    needs: [deb, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || echo "Plus One $GITHUB_REF_NAME" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.flatpak \
            --title "Plus One $GITHUB_REF_NAME" --notes-file notes.md
