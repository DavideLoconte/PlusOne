name: Release

on:
  push:
    tags: ["v*"]

# Read only, but for the job that publishes the release: the others run
# the build (and the app's dependencies), and must not be able to push.
permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Tag matches the app version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' plusone/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
      - name: Build test container
        run: docker build -f Dockerfile.ci -t plus-one-ci .
      - name: Tests and package (the release is only made if they pass)
        run: |
          mkdir -p dist
          docker run --rm -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -v "$PWD/dist:/src/dist" plus-one-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3  # v6.8
        with:
          bundle: plus-one_${{ github.ref_name }}_x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.gabrielesantangelo.PlusOne.yml
          cache: false  # a release is built from its sources alone
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: flatpak
          path: plus-one_*.flatpak

  apk:
    runs-on: ubuntu-24.04
    # Built without the key: Gradle, its plugins and the SDK's downloads
    # never run where the signing key is.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Companion app, unsigned
        run: tools/android-docker.sh assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  sign:
    # Only once the tests passed (deb) and the app built; the key lives in
    # this environment's secrets, which GitHub hands only to jobs run for a
    # v* tag (its deployment rule), and only to the step that signs.
    needs: [deb, apk]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: apk-unsigned
          path: unsigned
      - name: Sign (skipped without the key in the secrets)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}  # base64 of the PKCS#12 file
          PLUSONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then echo "no key: no APK in the release"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/keys" dist
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keys/release.p12"
          PLUSONE_KEYSTORE="$RUNNER_TEMP/keys/release.p12" tools/android-sign.sh \
              unsigned/app-release-unsigned.apk "dist/plus-one-companion_${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/keys/release.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: ignore

  publish:
    needs: [deb, flatpak, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || echo "Plus One $GITHUB_REF_NAME" > notes.md
      - name: Quick Settings extension (for the Flatpak; the .deb ships it)
        run: |
          ext=plus-one@gabrielesantangelo.github.io
          (cd "data/gnome-shell/$ext" && zip -qr "$GITHUB_WORKSPACE/dist/$ext.shell-extension.zip" .)
      - name: Checksums
        run: |
          shopt -s nullglob
          (cd dist && sha256sum *.deb *.flatpak *.zip *.apk > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.flatpak dist/*.zip dist/*.apk dist/SHA256SUMS \
            --title "Plus One $GITHUB_REF_NAME" --notes-file notes.md
