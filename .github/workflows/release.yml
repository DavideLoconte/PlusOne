name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' plusone/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
      - name: Build test container
        run: docker build -f Dockerfile.ci -t plus-one-ci .
      - name: Tests and package (the release is only made if they pass)
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/src/dist" plus-one-ci
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: plus-one_${{ github.ref_name }}_x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.gabrielesantangelo.PlusOne.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: plus-one_*.flatpak

  apk:
    runs-on: ubuntu-24.04
    env:
      # The release key (tools/android-docker.sh): base64 of the PKCS#12 file.
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      PLUSONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Companion app, signed (skipped without the key in the secrets)
        if: env.ANDROID_KEYSTORE != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keys/release.p12"
          PLUSONE_KEYSTORE="$RUNNER_TEMP/keys/release.p12" tools/android-docker.sh assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/plus-one-companion_${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE != ''
        with:
          name: apk
          path: dist/*.apk

  publish:
    needs: [deb, flatpak, apk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || echo "Plus One $GITHUB_REF_NAME" > notes.md
      - name: Quick Settings extension (for the Flatpak; the .deb ships it)
        run: |
          ext=plus-one@gabrielesantangelo.github.io
          (cd "data/gnome-shell/$ext" && zip -qr "$GITHUB_WORKSPACE/dist/$ext.shell-extension.zip" .)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.flatpak dist/*.zip dist/*.apk \
            --title "Plus One $GITHUB_REF_NAME" --notes-file notes.md
