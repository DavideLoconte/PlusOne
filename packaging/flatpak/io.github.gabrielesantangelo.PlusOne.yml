app-id: io.github.gabrielesantangelo.PlusOne
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: plus-one

finish-args:
  - --share=network                 # the tablet's app: its link, the desktop, the sound
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # /dev/uhid turns the S Pen into a real tablet (--device=dri would do for
  # the encoders, NVIDIA's included; uhid needs all).
  - --device=all
  - --filesystem=xdg-run/pipewire-0 # capture of the virtual monitor
  - --talk-name=org.gnome.Mutter.ScreenCast
  - --talk-name=org.gnome.Mutter.RemoteDesktop
  - --talk-name=org.gnome.Mutter.DisplayConfig
  # The S Pen's helper on the host (from the .deb or enable-pen.sh), for its pressure.
  - --system-talk-name=io.github.gabrielesantangelo.PlusOne.Pen
  # Finding the tablets' app (mDNS): without it nothing can be paired.
  - --system-talk-name=org.freedesktop.Avahi
  # The tablet's microphone: a PipeWire source made with pactl.
  - --socket=pulseaudio
  # Map the pen onto the tablet's monitor in the host's GNOME settings (dconf).
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --env=GSETTINGS_BACKEND=dconf

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man

modules:
  # PDF rendering for "Sign on Tablet" (GObject introspection, cairo backend).
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=ON
      - -DENABLE_UTILS=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_LIBTIFF=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/gir-1.0
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-25.12.0.tar.xz
        sha256: c18b40eb36b1a0c5b86e29ca054bf0770304583da4f2cdd42fe86eca6a20de48

  # Stamping signatures onto the original PDF.
  - name: python3-pypdf
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} pypdf
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/18/42/a945f65cc61c739ec80f4112c4b78ed1791f25d33f45f19389c9c9e247e2/pypdf-6.20.0-py3-none-any.whl
        sha256: f003fc2014814d264fe7dd3f9d435c158e23e1a85a2233f87a0a2d6d21c914ad

  # The desktop in the app seals its packets with AES-GCM (appdisplay.py).
  - name: python3-cryptography
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} cryptography cffi pycparser
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/d3/69/2c833a049475e0a3444e94c7d0aca0aa51d166374a449b09e92ac98138de/cryptography-50.0.2-cp311-abi3-manylinux_2_34_x86_64.whl
        sha256: 9dab55f57c74c3cad24c323bacbbd04be4705ba6eb0d92e920b1fc4837ed5079
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/95/95/86342356ff5953b3fb06f7ef7c5bee212d45e770abc7218d451b9148313c/cffi-2.1.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: a931079504ecc49efed7744c476a5c343a92fabf66dec2db95edb1b2fdc770e2
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/90/11/0e6f11117525ff0eec40ebac3d313376f102df93ca44ad9e893ee85e4f89/pycparser-3.11-py3-none-any.whl
        sha256: 51d5a8ba2be0bbe440b99d2112604c95bbbc3c2748a64260186c541e1729cd80

  - name: plus-one
    buildsystem: simple
    build-commands:
      - install -d /app/lib/plus-one/plusone
      - install -m 644 plusone/*.py /app/lib/plus-one/plusone/
      - install -Dm 644 plusone/link/*.py -t /app/lib/plus-one/plusone/link
      - install -Dm 644 plusone/icons/*.svg -t /app/lib/plus-one/plusone/icons
      - install -Dm 755 packaging/flatpak/plus-one.sh /app/bin/plus-one
      - install -Dm 644 data/io.github.gabrielesantangelo.PlusOne.desktop -t /app/share/applications
      - install -Dm 644 data/io.github.gabrielesantangelo.PlusOne.Sign.desktop -t /app/share/applications
      - install -Dm 644 data/io.github.gabrielesantangelo.PlusOne.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm 644 data/io.github.gabrielesantangelo.PlusOne.metainfo.xml -t /app/share/metainfo
      # D-Bus activation (Flatpak exports it and wraps Exec in "flatpak run").
      - install -d /app/share/dbus-1/services
      - sed 's|^Exec=/usr/bin/|Exec=/app/bin/|' data/io.github.gabrielesantangelo.PlusOne.service
        > /app/share/dbus-1/services/io.github.gabrielesantangelo.PlusOne.service
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - dist
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - android
          - tests
          - tools
          - docs
