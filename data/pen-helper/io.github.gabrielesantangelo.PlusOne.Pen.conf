<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Plus One's S Pen helper: root owns the name; anyone may ask it for a
     pen, and polkit (io.github.gabrielesantangelo.plusone.pen) answers. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.gabrielesantangelo.PlusOne.Pen"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.gabrielesantangelo.PlusOne.Pen"
           send_interface="io.github.gabrielesantangelo.PlusOne.Pen" send_member="Open"/>
    <allow send_destination="io.github.gabrielesantangelo.PlusOne.Pen"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
