# The tablet's camera as a webcam (Plus One). Two loopback devices fed the same
# picture: the first shown to programs that read cameras themselves (Chrome
# needs exclusive_caps) only while Plus One feeds it; the second always a
# camera, which PipeWire (GNOME's Camera, the camera portal) only looks for when
# the device appears.
# Same name for both: a program sees only one of them. Names: 31 characters at most.
options v4l2loopback devices=2 exclusive_caps=1,0 card_label="Plus One tablet camera,Plus One tablet camera"
